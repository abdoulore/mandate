name: Mandate checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mandate_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: mandate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MANDATE_TEST_DATABASE_URL: postgresql://mandate_test:test_only@localhost:5432/mandate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate VPS Compose configuration
        run: |
          cp mandate.production.env.example mandate.production.env
          MANDATE_DOMAIN=mandate.example.com MANDATE_DB_PASSWORD=ci_only_hex docker compose -f compose.vps.yaml config --quiet
      - run: npm run typecheck
      - run: npm run test:invariants
      - run: npm run build
        env:
          MANDATE_PRODUCTION_BUILD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
